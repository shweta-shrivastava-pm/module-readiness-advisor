# What each capability breaks into, and what each piece needs.
# Built from public Google Cloud and Azure documentation. Synthetic examples only.
#
# Dependency types:
#   module_or_resource   another piece must exist first
#   existing_repository  something the application team already has
#   networking           network setup needed first
#   security_iam         identity or permission needed first
#   platform             a cloud API to switch on, usually quick
#   approval             a decision from architecture or the customer
#   demand               no team has confirmed it will use this yet
#
# case and expected_readiness link each entry to docs/evaluation-set.md,
# so the advisor can score itself.

capabilities:

  - id: private_storage_bucket
    case: "1"
    expected_readiness: Blocked
    name: Private storage bucket for application logs
    sub_modules:
      - id: storage_bucket
        story: storage
        uses: [kms_key_ring]
      - id: bucket_iam_binding
        story: storage
        uses: [storage_bucket]
    dependencies:
      - type: security_iam
        need: Service account for the application that writes to the bucket

  - id: cloud_run_internal_api
    case: "2"
    expected_readiness: Blocked
    name: Cloud Run service for an internal API
    sub_modules:
      - id: cloud_run_service
        story: compute
        uses: [artifact_registry]
      - id: service_account
        story: compute
      - id: vpc_connector
        story: networking
        uses: [shared_vpc]
    dependencies:
      - type: networking
        need: Subnet range for the VPC connector
      - type: platform
        need: Cloud Run API enabled

  - id: cloud_sql_unconfirmed
    case: "3a"
    expected_readiness: Needs decision
    name: Cloud SQL instance with no confirmed consumer
    sub_modules:
      - id: cloud_sql_instance
        story: database
        uses: [shared_vpc, kms_key_ring]
      - id: database
        story: database
      - id: database_users
        story: database
      - id: backup_configuration
        story: backup
      - id: private_service_access
        story: networking
    dependencies:
      - type: demand
        need: No application team has committed to consuming this module

  - id: pubsub_pipeline
    case: "4"
    expected_readiness: Ready
    name: Pub/Sub topic and subscription for an event pipeline
    sub_modules:
      - id: pubsub_topic
        story: messaging
      - id: pubsub_subscription
        story: messaging
        uses: [pubsub_topic]
      - id: dead_letter_topic
        story: messaging
      - id: pubsub_iam_bindings
        story: messaging
    dependencies:
      - type: platform
        need: Pub/Sub API enabled

  - id: azure_storage_account
    case: "5"
    expected_readiness: Needs decision
    name: Azure storage account for document retention
    sub_modules:
      - id: storage_account
        story: storage
      - id: storage_container
        story: storage
        uses: [storage_account]
      - id: private_endpoint
        story: networking
      - id: diagnostic_settings
        story: observability
    dependencies:
      - type: networking
        need: Subnet for the private endpoint
      - type: approval
        need: Agreed IAM approach for the storage account

  - id: private_dns_record
    case: "7"
    expected_readiness: Blocked
    name: Private DNS record for an internal service
    sub_modules:
      - id: dns_record_set
        story: networking
        uses: [private_dns_zone, target_service]

  - id: application_monitoring
    case: "8"
    expected_readiness: Needs decision
    name: Monitoring and alerting for an existing application
    sub_modules:
      - id: notification_channels
        story: alerting
      - id: alert_policies
        story: alerting
        uses: [notification_channels]
      - id: dashboards
        story: dashboards
      - id: uptime_checks
        story: uptime
      - id: log_based_metrics
        story: alerting
    dependencies:
      - type: approval
        need: Who receives alerts, and at what severity

  - id: new_environment_network
    case: "9"
    expected_readiness: Needs decision
    name: VPC and subnets for a new environment
    sub_modules:
      - id: vpc
        story: network_core
      - id: subnets
        story: network_core
        uses: [vpc]
      - id: firewall_rules
        story: firewall
        uses: [vpc]
      - id: cloud_router
        story: egress
        uses: [vpc]
      - id: cloud_nat
        story: egress
        uses: [cloud_router]
      - id: private_service_access
        story: private_access
        uses: [vpc]
      - id: flow_logs
        story: network_core
        uses: [subnets]
    dependencies:
      - type: approval
        need: IP address range allocation for the new environment

  - id: reuse_shared_vpc
    case: "11"
    expected_readiness: Blocked
    name: Reuse the existing shared VPC for a new application
    sub_modules:
      - id: subnet_iam_binding
        story: access
        uses: [shared_vpc]
    dependencies:
      - type: security_iam
        need: The service account to bind

  - id: application_secrets
    case: "13"
    expected_readiness: Blocked
    name: Secrets management for an application
    sub_modules:
      - id: secret
        story: secrets
        uses: [kms_key_ring]
      - id: secret_version
        story: secrets
        uses: [secret]
      - id: secret_iam_bindings
        story: access
        uses: [secret]
      - id: rotation_configuration
        story: rotation
        uses: [secret]
    dependencies:
      - type: security_iam
        need: Who can access the secret, and the rotation policy
      - type: platform
        need: Secret Manager API enabled

  - id: audit_log_sink_unconfirmed
    case: "19"
    expected_readiness: Needs decision
    name: Audit log sink with no confirmed consumer
    sub_modules:
      - id: log_sink
        story: logging
      - id: destination_bucket
        story: logging
        uses: [kms_key_ring]
      - id: sink_service_account
        story: logging
      - id: sink_iam_binding
        story: logging
        uses: [sink_service_account, destination_bucket]
      - id: retention_policy
        story: logging
        uses: [destination_bucket]
    dependencies:
      - type: demand
        need: No team has requested or committed to consuming these logs

  - id: redis_session_cache
    case: "20"
    expected_readiness: Ready
    name: Redis cache for session storage
    sub_modules:
      - id: memorystore_instance
        story: cache
        uses: [shared_vpc]
      - id: cache_firewall_rule
        story: cache
        uses: [shared_vpc]
      - id: cache_monitoring
        story: observability
        uses: [memorystore_instance]
    dependencies:
      - type: platform
        need: Memorystore API enabled

  - id: vertex_ai_workspace
    case: "21"
    expected_readiness: Needs decision
    name: Vertex AI environment for a machine learning team
    sub_modules:
      - id: workbench_instance
        story: workbench
        uses: [shared_vpc, kms_key_ring]
      - id: ml_service_account
        story: workbench
      - id: ml_iam_bindings
        story: workbench
        uses: [ml_service_account]
      - id: model_endpoint
        story: serving
      - id: private_connectivity
        story: networking
        uses: [shared_vpc]
      - id: training_data_bucket
        story: data
        uses: [kms_key_ring]
    dependencies:
      - type: platform
        need: Vertex AI API enabled
      - type: security_iam
        need: Who is allowed to deploy models
      - type: approval
        need: Whether public model endpoints are ever allowed

  - id: document_ai_forms
    case: "22"
    expected_readiness: Needs decision
    name: Document AI for processing scanned forms
    sub_modules:
      - id: document_ai_processor
        story: processing
      - id: input_bucket
        story: storage
        uses: [kms_key_ring]
      - id: output_bucket
        story: storage
        uses: [kms_key_ring]
      - id: processor_service_account
        story: processing
      - id: processor_iam_bindings
        story: processing
        uses: [processor_service_account]
    dependencies:
      - type: platform
        need: Document AI API enabled
      - type: approval
        need: Which processing region is allowed, since forms may contain personal data

  - id: genai_model_access
    case: "23"
    expected_readiness: Needs decision
    name: Generative AI model access for a customer support assistant
    sub_modules:
      - id: genai_service_account
        story: access
      - id: genai_iam_bindings
        story: access
        uses: [genai_service_account]
      - id: model_quota
        story: quota
      - id: genai_private_connectivity
        story: networking
        uses: [shared_vpc]
      - id: prompt_logging
        story: governance
      - id: data_protection_controls
        story: governance
    dependencies:
      - type: platform
        need: Model API enabled
      - type: security_iam
        need: Which identities can call the model
      - type: approval
        need: What customer data the model may see, and whether prompts may be logged

  - id: bigquery_analytics
    case: "3"
    expected_readiness: Needs decision
    name: BigQuery setup for an analytics workload
    sub_modules:
      - id: bq_dataset
        story: dataset
        uses: [kms_key_ring]
      - id: bq_tables
        story: dataset
        uses: [bq_dataset]
      - id: partitioning_and_clustering
        story: dataset
        uses: [bq_tables]
      - id: bq_views
        story: dataset
        uses: [bq_tables]
      - id: authorised_views
        story: access
        uses: [bq_views]
      - id: dataset_iam_bindings
        story: access
        uses: [bq_dataset]
      - id: table_iam_bindings
        story: access
        uses: [bq_tables]
      - id: scheduled_queries
        story: loading
        uses: [bq_tables]
      - id: data_transfer_config
        story: loading
        uses: [bq_dataset]
      - id: audit_log_sink
        story: audit
      - id: cost_controls
        story: cost
    dependencies:
      - type: security_iam
        need: Dataset level access model
      - type: existing_repository
        need: Where the source data already lives
      - type: approval
        need: Whether cost controls are in scope

  - id: gke_cluster
    case: "6"
    expected_readiness: Blocked
    name: GKE cluster for a containerised application
    sub_modules:
      - id: gke_cluster
        story: cluster
        uses: [shared_vpc]
      - id: node_pools
        story: cluster
        uses: [gke_cluster]
      - id: cluster_autoscaler_config
        story: cluster
        uses: [node_pools]
      - id: gke_service_account
        story: identity
      - id: workload_identity
        story: identity
        uses: [gke_service_account, artifact_registry]
      - id: network_policy
        story: network_policy
        uses: [gke_cluster]
      - id: private_endpoint_config
        story: cluster
        uses: [gke_cluster]
      - id: logging_monitoring_config
        story: observability
        uses: [gke_cluster]
    dependencies:
      - type: networking
        need: Pod and service IP ranges on the subnet
      - type: security_iam
        need: Workload identity binding
      - type: platform
        need: GKE API enabled

  - id: aks_cluster
    case: "10"
    expected_readiness: Blocked
    name: Azure Kubernetes Service cluster
    sub_modules:
      - id: aks_cluster
        story: cluster
      - id: aks_node_pools
        story: cluster
        uses: [aks_cluster]
      - id: aks_network_configuration
        story: cluster
        uses: [aks_cluster]
      - id: managed_identity
        story: identity
      - id: role_assignments
        story: identity
        uses: [managed_identity]
      - id: container_registry_access
        story: identity
        uses: [managed_identity]
      - id: log_analytics_workspace
        story: observability
    dependencies:
      - type: networking
        need: Subnet with sufficient address space
      - type: security_iam
        need: Managed identity and role assignments approved

  - id: storage_to_warehouse_pipeline
    case: "12"
    expected_readiness: Needs decision
    name: Data pipeline from storage into the warehouse
    sub_modules:
      - id: source_bucket
        story: source
        uses: [kms_key_ring]
      - id: bucket_notification
        story: source
        uses: [source_bucket, pipeline_topic]
      - id: pipeline_topic
        story: source
      - id: pipeline_subscription
        story: processing
        uses: [pipeline_topic]
      - id: processing_job
        story: processing
        uses: [pipeline_subscription]
      - id: pipeline_dead_letter
        story: processing
      - id: pipeline_scheduling
        story: processing
        uses: [processing_job]
      - id: destination_dataset
        story: destination
        uses: [kms_key_ring]
      - id: destination_tables
        story: destination
        uses: [destination_dataset]
      - id: pipeline_service_accounts
        story: processing
      - id: pipeline_iam_bindings
        story: processing
        uses: [pipeline_service_accounts]
      - id: pipeline_monitoring
        story: monitoring
        uses: [processing_job]
    dependencies:
      - type: existing_repository
        need: The source data location
      - type: security_iam
        need: Cross service permissions
      - type: approval
        need: Processing approach, for example Dataflow or Cloud Run

  - id: public_load_balancer
    case: "14"
    expected_readiness: Needs decision
    name: Load balancer for a public web application
    note: The inventory has a private DNS zone. A near match is not a match, so the public zone is flagged as missing.
    sub_modules:
      - id: global_load_balancer
        story: load_balancer
        uses: [public_dns_zone]
      - id: url_map
        story: load_balancer
        uses: [backend_service]
      - id: forwarding_rule
        story: load_balancer
        uses: [global_load_balancer]
      - id: backend_service
        story: backend
        uses: [health_check]
      - id: health_check
        story: backend
      - id: ssl_certificate
        story: certificate
      - id: cloud_armor_policy
        story: cloud_armor
    dependencies:
      - type: security_iam
        need: Cloud Armor rules
      - type: approval
        need: The WAF ruleset

  - id: azure_scheduled_function
    case: "16"
    expected_readiness: Blocked
    name: Azure Function for scheduled processing
    note: The storage account looks independent but the function app cannot run without it, so it shares the function app story.
    sub_modules:
      - id: function_app
        story: function_app
        uses: [app_service_plan, function_storage_account]
      - id: app_service_plan
        story: function_app
      - id: function_storage_account
        story: function_app
      - id: function_managed_identity
        story: identity
      - id: function_role_assignments
        story: identity
        uses: [function_managed_identity]
      - id: application_insights
        story: observability
    dependencies:
      - type: security_iam
        need: Managed identity permissions
      - type: platform
        need: Resource providers registered

  - id: internal_api_service_account
    case: "17"
    expected_readiness: Needs decision
    name: Service account for an application to call internal APIs
    note: Keys are not created when workload identity is available.
    sub_modules:
      - id: app_service_account
        story: identity
        uses: [internal_apis]
      - id: app_iam_role_bindings
        story: identity
        uses: [app_service_account]
      - id: app_workload_identity_binding
        story: identity
        uses: [app_service_account]
    dependencies:
      - type: approval
        need: Which roles are granted

  - id: cloud_composer
    case: "18"
    expected_readiness: Blocked
    name: Cloud Composer environment for orchestration
    sub_modules:
      - id: composer_environment
        story: environment
        uses: [shared_vpc, kms_key_ring]
      - id: composer_private_ip_config
        story: environment
        uses: [composer_environment]
      - id: composer_service_account
        story: identity
      - id: composer_iam_bindings
        story: identity
        uses: [composer_service_account]
      - id: dags_bucket
        story: dags_bucket
        uses: [kms_key_ring]
    dependencies:
      - type: networking
        need: Subnet ranges for the environment
      - type: security_iam
        need: Service account permissions
      - type: platform
        need: Composer API enabled
